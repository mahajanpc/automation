name: Daily Instagram Reel & Story Publisher

on:
  schedule:
    # Runs daily at 12:00 UTC (5:30 PM IST). Adjust as needed.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Health Topic (leave blank for next in catalog)'
        required: false
        default: ''
      mode:
        description: 'Execution Mode'
        required: false
        default: 'review'
        type: choice
        options:
          - review
          - publish

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Telugu Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-core fonts-noto-ui-core fonts-noto-extra

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reel Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          VOICE_NAME: "te-IN-ShrutiNeural"
          EXECUTION_MODE: ${{ secrets.EXECUTION_MODE || 'review' }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python main.py --mode "${{ github.event.inputs.mode || 'review' }}" --topic "${{ github.event.inputs.topic }}"
          else
            python main.py --mode "${{ github.event.inputs.mode || 'review' }}"
          fi
